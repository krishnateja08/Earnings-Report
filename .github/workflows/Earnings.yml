name: Daily earnings dashboard

on:
  schedule:
    # 22:00 UTC = 4:00 PM CST (Central Standard Time, UTC-6).
    # NOTE: GitHub Actions cron is always UTC and does NOT auto-adjust for
    # US daylight saving. During Central Daylight Time (CDT, UTC-5,
    # roughly mid-March -> early November) this same line will actually
    # fire at 5:00 PM local time instead of 4:00 PM. If you want it to
    # stay pinned to 4:00 PM local clock time year-round, uncomment the
    # second cron line below (21:00 UTC) and disable/enable whichever one
    # matches the current time-of-year, or switch both on and add a quick
    # date check at the top of the job to skip the "wrong" one.
    - cron: "0 22 * * *"
    # - cron: "0 21 * * *"   # 4:00 PM CDT (UTC-5), optional second entry
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write   # needed so the workflow can commit docs/index.html back

jobs:
  build-and-notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run earnings dashboard script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ENABLED: "true"
          TELEGRAM_MARKETS: "BOTH"
        run: python india_earnings_dashboard.py

      - name: Commit and push updated dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git diff --staged --quiet || git commit -m "Update earnings dashboard $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
